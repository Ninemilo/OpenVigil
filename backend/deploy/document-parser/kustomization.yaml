apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: windops
resources:
  - ../hybrid-tower
  - document-worker.yaml
  - network-policy.yaml
patches:
  - target:
      kind: NetworkPolicy
      name: windops-runtime-egress
    patch: |-
      - op: replace
        path: /spec/podSelector/matchExpressions/0/values
        value: [care-worker, structural-worker, document-worker]
labels:
  - pairs:
      app.kubernetes.io/part-of: windops-backend
    includeSelectors: false
    includeTemplates: true
